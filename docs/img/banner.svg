<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="watch-esp32 — custom firmware for the Waveshare ESP32-S3-Touch-AMOLED-2.06">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E0E10"/>
      <stop offset="1" stop-color="#17171C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.12" cy="0.05" r="0.75">
      <stop offset="0" stop-color="#E8590C" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#E8590C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.88" cy="1.05" r="0.7">
      <stop offset="0" stop-color="#00E5A0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#00E5A0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#415074"/>
      <stop offset="1" stop-color="#161B26"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="26" fill="url(#glow)"/>
  <rect width="1200" height="300" rx="26" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1198" height="298" rx="25" fill="none" stroke="#26262D"/>

  <text x="72" y="130" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="62" font-weight="700" letter-spacing="-1.6" fill="#F5F5F7">watch-esp32</text>
  <text x="74" y="172" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="21" fill="#A8A8B3">A 2.06-inch AMOLED smartwatch running firmware you own.</text>

  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#C9C9D2">
    <rect x="72" y="200" width="96" height="28" rx="14" fill="#1C1C22" stroke="#2C2C34"/>
    <text x="120" y="219" text-anchor="middle">ESP32-S3</text>
    <rect x="180" y="200" width="128" height="28" rx="14" fill="#1C1C22" stroke="#2C2C34"/>
    <text x="244" y="219" text-anchor="middle">ESP-IDF 5.5.1</text>
    <rect x="320" y="200" width="98" height="28" rx="14" fill="#1C1C22" stroke="#2C2C34"/>
    <text x="369" y="219" text-anchor="middle">LVGL 9.3</text>
    <rect x="430" y="200" width="76" height="28" rx="14" fill="#1C1C22" stroke="#2C2C34"/>
    <text x="468" y="219" text-anchor="middle">3 apps</text>
  </g>

  <text x="74" y="268" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="13" fill="#6E6E7A">410 × 502 AMOLED · capacitive touch · 8 MB PSRAM · 32 MB flash</text>

  <g transform="translate(910,28)">
    <rect x="60" y="0" width="190" height="244" rx="36" fill="#131316" stroke="#2E2E36" stroke-width="2"/>
    <rect x="248" y="92" width="6" height="34" rx="3" fill="#2E2E36"/>
    <rect x="76" y="26" width="158" height="193" rx="24" fill="#0B0B0D"/>
    <rect x="116" y="62" width="78" height="78" rx="17" fill="url(#tile)"/>

    <g fill="#E9F1FF">
      <rect x="151.75" y="78.5" width="6.5" height="9" rx="2" transform="rotate(0 155 101)"/>
      <rect x="151.75" y="78.5" width="6.5" height="9" rx="2" transform="rotate(45 155 101)"/>
      <rect x="151.75" y="78.5" width="6.5" height="9" rx="2" transform="rotate(90 155 101)"/>
      <rect x="151.75" y="78.5" width="6.5" height="9" rx="2" transform="rotate(135 155 101)"/>
      <rect x="151.75" y="78.5" width="6.5" height="9" rx="2" transform="rotate(180 155 101)"/>
      <rect x="151.75" y="78.5" width="6.5" height="9" rx="2" transform="rotate(225 155 101)"/>
      <rect x="151.75" y="78.5" width="6.5" height="9" rx="2" transform="rotate(270 155 101)"/>
      <rect x="151.75" y="78.5" width="6.5" height="9" rx="2" transform="rotate(315 155 101)"/>
      <circle cx="155" cy="101" r="15"/>
    </g>
    <circle cx="155" cy="101" r="6.2" fill="#2B3A52"/>

    <text x="155" y="160" text-anchor="middle" font-size="11.5" fill="#8E93A1"
          font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">Paramètres</text>
    <rect x="132" y="186" width="13" height="5" rx="2.5" fill="#E9E9EF"/>
    <circle cx="152" cy="188.5" r="2.5" fill="#3A3A44"/>
  </g>
</svg>
